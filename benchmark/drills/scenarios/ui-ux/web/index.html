<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report a leak - Northbank Water</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.access-widget.example/v3/widget.js"
          data-account="nbw-4471" defer></script>
</head>
<body>
  <header class="bar">
    <img src="logo.png">
    <span class="name">Northbank Water</span>
  </header>

  <main>
    <h1>Report a leak</h1>
    <p>
      Tell us where the water is and we will get someone out to look.
      If water is coming into a building, ring 0800 000 0000 instead.
    </p>

    <form method="post" action="/leaks" id="leak">
      <input type="text" name="postcode" id="postcode"
             placeholder="Postcode">
      <input type="text" name="where" id="where"
             placeholder="Where is the water coming from?">
      <label for="phone">Phone number</label>
      <input type="text" name="phone" id="phone">
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>Northbank Water Limited. Registered in England.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
