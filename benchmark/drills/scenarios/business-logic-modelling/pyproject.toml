[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomstay"
version = "0.1.0"
description = "Room booking model"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["booking"]

[tool.pytest.ini_options]
testpaths = ["harness"]
