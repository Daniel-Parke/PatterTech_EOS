[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-orders"
version = "0.4.0"
description = "Order pricing, card authorisation and reminder scheduling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["pricing", "gateway", "fakes", "checkout", "scheduling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
