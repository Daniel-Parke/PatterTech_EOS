# Canonical dependency declaration for the EOS tooling (ADR-0002
# clarification 6 and directive: one canonical source; requirements files
# are GENERATED from this with pinned transitive hashes and never edited
# by hand). Regenerate with: python tools/gen_lock.py
# Note: pip-tools 7.4.1 and 7.5.1 are incompatible with the installed pip
# (PackageFinder API change), so the committed stdlib generator
# tools/gen_lock.py produces the lock via pip download + pip hash. The pip
# version used for the committed locks: see the header of the lock files.

[project]
name = "eos-tools"
version = "2.1.0"
# ADR-0007 holds v2 unreleased and folds v2.1 into the same line, so this
# is the first released version and it carries the v2.1 number. The
# CHANGELOG's newest heading and the release tag say the same thing, and
# check S011 holds the three to each other.
description = "PatterTech EOS tooling: the repository checker, the task router, the action-time guard, context packets, task records, seed migration and the benchmark wrappers"
# ADR-0006 decision 7 puts the repository under Apache-2.0. The terms are
# in LICENSE at the repository root and the attributions in NOTICE, one
# level above this file, so no path here can point at either: a build
# backend refuses a license-files entry outside the project directory.
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]
