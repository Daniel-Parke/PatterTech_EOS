# PatterTech estate: machine-readable repo ownership and interaction manifest.
#
# This file states, per repo, what it OWNS and DOES NOT own, so any AI agent (or
# person) picking up any repo can orient from one read: which repo owns which
# responsibility, where documentation belongs, where content is generated, where
# it is rendered, and how the systems interact.
#
# Companions: estate/ESTATE_MAP.md is the human narrative of the same map;
# registry/PROJECTS.md is the governance and harvest ledger (venture status, EOS
# pins). This file is a plain data file: eos_check does not scan .yaml, so it
# carries no front-matter.

version: 1
updated: "2026-07-08"
root: C:\Users\Daniel\Documents\Coding\Github

repos:
  PatterTech_EOS:
    path: C:\Users\Daniel\Documents\Coding\Github\PatterTech_EOS
    role: The engineering operating system, the shared knowledge and doctrine brain (no build).
    status: live
    owns:
      - Engineering doctrine (web-design, architecture, delivery, devops, voice)
      - Wargames, kernel templates, registries, the governance layer
      - This estate manifest (estate/repos.yaml and estate/ESTATE_MAP.md)
    does_not_own:
      - Any runnable product or venture code
      - Runtime services (those are PatterStack, inside PatterStudio)
      - The design-system code (that lives in PatterTech_Website, later PatterTech_WebKit)
    commands:
      check: python tools/eos_check.py --repo
    agent_files: AGENTS.md + byte-identical CLAUDE.md (enforced by eos_check E003)

  PatterTech_Website:
    path: C:\Users\Daniel\Documents\Coding\Github\PatterTech_Website
